[package]
name = "ddnet-exporter"
version = "0.2.0"
edition = "2024"

[dependencies]
hyper = { version = "1.11", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
lazy_static = "1.5"
prometheus = "0.14"
tokio = { version = "1.53", features = ["full"] }
regex = "1.13"
log = "0.4"
ddapi-rs = "0.8"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
envy = "0.4"
anyhow = "1.0"
